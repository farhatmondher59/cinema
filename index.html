<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Menu</title>

<style>
:root {
    --gold: #c9a24d;
    --black: #0b0b0b;
    --dark: #111;
    --white: #ffffff;
    --gray: #1c1c1c;
}

body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    color: var(--white);
}

.hidden {
    display: none;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 24px;
}

h1 {
    text-align: center;
    font-weight: 600;
    letter-spacing: 1px;
}

.gold-line {
    width: 70px;
    height: 3px;
    background: var(--gold);
    margin: 12px auto 36px;
    border-radius: 2px;
}

/* ===== ARTICLES PAGE ===== */
.articles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
}

.article-card {
    position: relative;
    height: 190px;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.article-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 40px rgba(201,162,77,0.35);
}

.article-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.1) brightness(0.9);
}

.article-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.8),
        rgba(0,0,0,0.25)
    );
    display: flex;
    align-items: flex-end;
    padding: 18px;
}

.article-title {
    color: var(--white);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 1px;
}

.back-btn {
    margin-bottom: 20px;
    color: var(--gold);
    cursor: pointer;
    font-size: 16px;
    letter-spacing: 0.5px;
}

.items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 22px;
}

.item {
    background: var(--gray);
    border-radius: 18px;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.5);
}

.item img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    filter: brightness(0.9);
}

.item-name {
    margin: 14px 0 6px;
    font-size: 16px;
    letter-spacing: 0.5px;
}

.price {
    color: var(--gold);
    margin-bottom: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
}
</style>

</head>

<body>

<div class="container" id="articlesPage">
    <h1>Menu</h1>
    <div class="gold-line"></div>

    <div class="articles">
        <div class="article-card" onclick="openCategory('coffee')">
            <img src="sahbek rajel.png">
            <div class="article-overlay"><div class="article-title">Coffee</div></div>
        </div>

        <div class="article-card" onclick="openCategory('the')">
            <img src="sahbek rajel.png">
            <div class="article-overlay"><div class="article-title">Thé</div></div>
        </div>

        <div class="article-card" onclick="openCategory('jus')">
            <img src="sahbek rajel.png">
            <div class="article-overlay"><div class="article-title">Jus</div></div>
        </div>

        <div class="article-card" onclick="openCategory('sweets')">
            <img src="sahbek rajel.png">
            <div class="article-overlay"><div class="article-title">Sweets</div></div>
        </div>

        <div class="article-card" onclick="openCategory('drinks')">
            <img src="sahbek rajel.png">
            <div class="article-overlay"><div class="article-title">Drinks</div></div>
        </div>
    </div>
</div>

<div class="container hidden" id="itemsPage">
    <div class="back-btn" onclick="goBack()">← Retour</div>
    <h1 id="categoryTitle"></h1>
    <div class="gold-line"></div>
    <div class="items" id="itemsContainer"></div>
</div>

<script>
const data = {
    coffee: 6,
    the: 4,
    jus: 3,
    sweets: 2,
    drinks: 2
};

function openCategory(category) {
    document.getElementById("articlesPage").classList.add("hidden");
    document.getElementById("itemsPage").classList.remove("hidden");
    document.getElementById("categoryTitle").innerText = category.toUpperCase();

    const container = document.getElementById("itemsContainer");
    container.innerHTML = "";

    for (let i = 0; i < data[category]; i++) {
        container.innerHTML += `
            <div class="item">
                <img src="image.png">
                <div class="item-name">Article</div>
                <div class="price">10 DT</div>
            </div>
        `;
    }
}

function goBack() {
    document.getElementById("itemsPage").classList.add("hidden");
    document.getElementById("articlesPage").classList.remove("hidden");
}
</script>

</body>
</html>
